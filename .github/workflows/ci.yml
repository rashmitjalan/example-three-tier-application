name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-check:
    name: API syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/api/package-lock.json

      - name: Install API dependencies
        working-directory: src/api
        run: npm ci

      - name: Syntax check index.js
        run: node --check src/api/index.js
